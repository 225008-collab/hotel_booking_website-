{% extends 'base.html' %}
{% block title %}Login – Esaystay{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 80vh;">
  <div class="card shadow-lg border-0 rounded-4 p-4" style="max-width: 400px; width: 100%;">
    <div class="text-center mb-4">
      <h2 class="fw-bold text-primary">Welcome Back</h2>
      <p class="text-muted">Login to continue your journey with <strong>Esaystay</strong></p>
    </div>
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label fw-semibold">Username</label>
        <input type="text" name="username" class="form-control form-control-lg rounded-3" placeholder="Enter your username" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Password</label>
        <input type="password" name="password" class="form-control form-control-lg rounded-3" placeholder="Enter your password" required>
      </div>
      <button class="btn btn-primary btn-lg w-100 rounded-3">Login</button>
      <div class="text-center mt-3">
        <small class="text-muted">Don't have an account?</small>
        <a href="{% url 'register' %}" class="text-decoration-none fw-semibold">Create account</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
